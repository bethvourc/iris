# XcodeGen spec — regenerate Iris.xcodeproj with `xcodegen generate`.
# The generated project is committed so the app opens without xcodegen,
# but this file is the source of truth for project structure.
name: Iris
options:
  bundleIdPrefix: com.bethvour
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM lives in Config/Signing.xcconfig, which optionally includes a
# git-ignored Config/Signing.local.xcconfig — see that file for local signing.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Iris:
    type: application
    platform: macOS
    sources: [Iris]
    dependencies:
      - target: IrisKit
        embed: true
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bethvour.iris
        INFOPLIST_FILE: Iris/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Iris/Iris.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Embed the relocatable Python runtime into Contents/Resources. The script
    # no-ops for Debug (dev mode runs the daemon from the repo via uv), so this
    # only adds time to Release builds. Runs after signing of the app's own code;
    # scripts/sign_and_notarize.sh re-signs the runtime for release.
    postBuildScripts:
      - name: Embed Python runtime
        script: '"${SRCROOT}/scripts/package_python.sh"'
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  IrisKit:
    type: framework
    platform: macOS
    sources: [IrisKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bethvour.iris.kit
        GENERATE_INFOPLIST_FILE: YES

  IrisTests:
    type: bundle.unit-test
    platform: macOS
    sources: [IrisTests]
    dependencies:
      - target: IrisKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  IrisUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [IrisUITests]
    dependencies:
      - target: Iris
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Iris:
    build:
      targets:
        Iris: all
    test:
      targets:
        - IrisTests
  IrisUITests:
    build:
      targets:
        Iris: all
    test:
      targets:
        - IrisUITests
