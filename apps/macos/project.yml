# XcodeGen spec — regenerate Iris.xcodeproj with `xcodegen generate`.
# The generated project is committed so the app opens without xcodegen,
# but this file is the source of truth for project structure.
name: Iris
options:
  bundleIdPrefix: com.bethvour
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Local Apple Development signing so app + UI test runner share a Team
    # ID (XCUITest requires it). CI overrides with CODE_SIGNING_ALLOWED=NO
    # for unit tests; Developer ID release signing arrives in Step 7.2.
    DEVELOPMENT_TEAM: 264K2T9HX2
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Iris:
    type: application
    platform: macOS
    sources: [Iris]
    dependencies:
      - target: IrisKit
        embed: true
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bethvour.iris
        INFOPLIST_FILE: Iris/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Iris/Iris.entitlements
    # Embed the relocatable Python runtime into Contents/Resources. The script
    # no-ops for Debug (dev mode runs the daemon from the repo via uv), so this
    # only adds time to Release builds. Runs after signing of the app's own code
    # but the runtime is re-signed in Step 7.2.
    postBuildScripts:
      - name: Embed Python runtime
        script: '"${SRCROOT}/scripts/package_python.sh"'
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  IrisKit:
    type: framework
    platform: macOS
    sources: [IrisKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bethvour.iris.kit
        GENERATE_INFOPLIST_FILE: YES

  IrisTests:
    type: bundle.unit-test
    platform: macOS
    sources: [IrisTests]
    dependencies:
      - target: IrisKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  IrisUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [IrisUITests]
    dependencies:
      - target: Iris
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Iris:
    build:
      targets:
        Iris: all
    test:
      targets:
        - IrisTests
  IrisUITests:
    build:
      targets:
        Iris: all
    test:
      targets:
        - IrisUITests
