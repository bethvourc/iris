name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repo, and PRs from forks run
# this workflow with untrusted code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q

  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      # Pinned: new SwiftFormat releases add default-on rules (0.63.0 added
      # wrapIfStatementBodies), which would fail every PR on untouched code.
      # Bump the version and the checksum together, then reformat in one PR.
      - name: Install SwiftFormat (pinned)
        env:
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
        working-directory: apps/macos
      - name: SwiftLint
        run: swiftlint --strict
        working-directory: apps/macos
      - name: SwiftFormat (lint only)
        run: swiftformat --version && swiftformat --lint .
        working-directory: apps/macos
      - name: Build and test
        run: >
          xcodebuild test
          -project Iris.xcodeproj
          -scheme Iris
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
        working-directory: apps/macos

  release-scripts:
    name: Release scripts (ad-hoc dry run)
    # Exercises the release pipeline logic — embed runtime, inside-out sign,
    # DMG — without any signing secrets, so regressions surface on every PR.
    # Single-arch build for speed; universality is covered by the runtime build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: brew install xcodegen create-dmg
      - name: Shell syntax check
        run: bash -n scripts/*.sh
        working-directory: apps/macos
      - name: Generate project
        run: xcodegen generate
        working-directory: apps/macos
      - name: Build unsigned Release (embeds the Python runtime)
        run: >
          xcodebuild
          -project Iris.xcodeproj
          -scheme Iris
          -configuration Release
          -derivedDataPath build
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build
        working-directory: apps/macos
      - name: Sign inside-out (ad-hoc, no notarization)
        env:
          DEVELOPER_ID_APP: "-"
          SKIP_NOTARIZE: "1"
        run: ./scripts/sign_and_notarize.sh build/Build/Products/Release/Iris.app
        working-directory: apps/macos
      - name: Build DMG (ad-hoc signed)
        env:
          DEVELOPER_ID_APP: "-"
        run: |
          set -euo pipefail
          ./scripts/make_dmg.sh build/Build/Products/Release/Iris.app /tmp/Iris-dryrun.dmg
          test -f /tmp/Iris-dryrun.dmg
          codesign --verify --strict build/Build/Products/Release/Iris.app
        working-directory: apps/macos
