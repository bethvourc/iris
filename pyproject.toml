[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-agent"
version = "0.1.0"
description = "A local Mac vision and control agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clinton Imaro" }]
dependencies = [
  "google-cloud-vision>=3.11.0",
  "openai>=2.8.0",
  "pynput>=1.8.1",
  "python-dotenv>=1.2.0",
  "sounddevice>=0.5.1",
  "websocket-client>=1.8.0",
  "pyobjc-framework-Cocoa>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
]

[project.scripts]
iris = "iris.cli:main"

[dependency-groups]
dev = ["anyio>=4.0", "pytest>=8.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
