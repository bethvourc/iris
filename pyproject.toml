[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-agent"
version = "0.1.0"
description = "A local-first voice and vision agent for macOS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clinton Imaro" }]
keywords = ["macos", "agent", "voice-assistant", "computer-use", "accessibility", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "google-cloud-vision>=3.11.0",
  "openai>=2.8.0",
  "pynput>=1.8.1",
  "python-dotenv>=1.2.0",
  "sounddevice>=0.5.1",
  "websocket-client>=1.8.0",
  "pyobjc-framework-Cocoa>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/bethvourc/iris"
Documentation = "https://github.com/bethvourc/iris/tree/main/docs/desktop"
Issues = "https://github.com/bethvourc/iris/issues"

[project.optional-dependencies]
# On-device wake word ("Hey Iris"): openWakeWord runs ONNX models locally, so
# no idle audio leaves the machine. Install with `pip install iris-agent[wakeword]`.
wakeword = [
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17",
  "numpy>=1.24",
]

[project.scripts]
iris = "iris.cli:main"

[dependency-groups]
dev = ["anyio>=4.0", "pytest>=8.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set so a ruff upgrade can't fail CI on untouched code (ruff
# 0.16 widened its defaults). These are the ruff 0.15 defaults; widen the
# selection deliberately, in its own PR, together with the fixes.
select = ["E4", "E7", "E9", "F"]
